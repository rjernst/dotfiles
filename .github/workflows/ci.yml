name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run BATS tests
        run: bats tests/

      - name: Install shellcheck (MacOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shellcheck scripts
        run: |
          errors=0
          # bootstrap uses /bin/bash
          if ! shellcheck --severity=warning bootstrap; then
            errors=$((errors + 1))
          fi
          # scripts/ directory (excluding macos/ which are mostly AppleScript)
          for f in scripts/*; do
            [ -f "$f" ] || continue
            if ! shellcheck --shell=bash --severity=warning "$f"; then
              errors=$((errors + 1))
            fi
          done
          # role install and setup scripts
          for f in roles/*/install roles/*/setup; do
            [ -f "$f" ] || continue
            if ! shellcheck --shell=bash --severity=warning "$f"; then
              errors=$((errors + 1))
            fi
          done
          # docker entrypoints
          for f in docker/*/entrypoint.sh; do
            [ -f "$f" ] || continue
            if ! shellcheck --severity=warning "$f"; then
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Zsh syntax check
        run: |
          errors=0
          for f in $(find . \( -name '*.zsh' -o -name 'zshrc' -o -name 'zsh_plugin' -o -path './roles/*/setup' -o -path './roles/*/install' \) | grep -v '.git/'); do
            if ! zsh -n "$f" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          exit $errors

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ralph image
        run: docker build -t ralph:latest docker/ralph/

      - name: Verify container environment
        run: |
          docker run --rm --entrypoint bash ralph:latest -c '
            set -e
            [ "$(whoami)" = "ralph" ]
            command -v git
            command -v claude
            command -v jq
            command -v rg
            [ "$(pwd)" = "/work" ]
          '

      - name: Smoke test entrypoint loop
        run: |
          tmp=$(mktemp -d)
          git init -q "$tmp"
          echo "Say hello" > "$tmp/PROMPT.md"

          # Stub claude inside the container by bind-mounting over the real binary
          mkdir -p "$tmp/bin"
          printf '#!/bin/bash\ncat > /dev/null\necho "claude stub ok"\n' > "$tmp/bin/claude"
          chmod +x "$tmp/bin/claude"

          docker run --rm \
            -v "$tmp:/work" \
            -v "$tmp/bin/claude:/usr/local/bin/claude:ro" \
            -e MAX_ITERATIONS=2 \
            -e PROMPT_FILE=PROMPT.md \
            -e MODEL=sonnet \
            -e PUSH=0 \
            ralph:latest 2>&1 | tee "$tmp/output.log"

          grep -q "iteration 1" "$tmp/output.log"
          grep -q "iteration 2" "$tmp/output.log"
          grep -q "reached max iterations (2)" "$tmp/output.log"
          grep -q "claude stub ok" "$tmp/output.log"
          rm -rf "$tmp"
