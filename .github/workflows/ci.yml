name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run BATS tests
        run: bats tests/

      - name: Install shellcheck (MacOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shellcheck scripts
        run: |
          errors=0
          # bootstrap uses /bin/bash
          if ! shellcheck --severity=warning bootstrap; then
            errors=$((errors + 1))
          fi
          # scripts/ directory (excluding macos/ which are mostly AppleScript)
          for f in scripts/*; do
            [ -f "$f" ] || continue
            if ! shellcheck --shell=bash --severity=warning "$f"; then
              errors=$((errors + 1))
            fi
          done
          # role install and setup scripts
          for f in roles/*/install roles/*/setup; do
            [ -f "$f" ] || continue
            if ! shellcheck --shell=bash --severity=warning "$f"; then
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Zsh syntax check
        run: |
          errors=0
          for f in $(find . \( -name '*.zsh' -o -name 'zshrc' -o -name 'zsh_plugin' -o -path './roles/*/setup' -o -path './roles/*/install' \) | grep -v '.git/'); do
            if ! zsh -n "$f" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          exit $errors

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sandbox image
        run: docker build -t agent-loop-sandbox-claude:test docker/agent-loop/claude/

      - name: Verify sandbox image
        run: |
          docker run --rm --entrypoint bash agent-loop-sandbox-claude:test -c '
            set -e
            command -v git
            command -v claude
            command -v jq
            command -v rg
          '

      - name: Build proxy image
        run: docker build -t agent-loop-proxy:test docker/agent-loop/proxy/
