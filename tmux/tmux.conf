# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- General ---
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh
set -g pane-border-lines heavy

# Auto-rename windows based on git repo and branch
set-option -g automatic-rename on
# #() only executes in top-level format strings, not in nested #{T:option} expansions,
# so the claude-status call is here rather than in status-right. Its output is empty
# (side effects only), so it doesn't affect the window name.
set-option -g automatic-rename-format '#(tmux-claude-status)#(tmux-window-name "#{pane_current_path}" "#{pane_current_command}")'

# True color and undercurl support
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- Splits ---
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# --- Navigation ---
# Vim-style pane selection
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind C-k resize-pane -U 10
bind C-j resize-pane -D 10
bind C-h resize-pane -L 10
bind C-l resize-pane -R 10

# Window navigation
bind C-p previous-window
bind C-n next-window

# Rename window (disables auto-rename for that window)
bind , set-option -w automatic-rename off \; command-prompt -I "#W" "rename-window -- '%%'"

# Workspace switcher popup
bind w run-shell "workspace-switcher"

# Window management
bind > command-prompt "move-window -t '%%'"
bind . command-prompt "swap-window -t '%%'"

# --- Notifications ---
set -g visual-activity off
set -g visual-bell on
set -g visual-silence on
set -g monitor-activity on
set -g bell-action none

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Platform-specific copy integration
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe 'pbcopy'; \
   unbind -T copy-mode-vi Enter; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe 'pbcopy'; \
   bind ] run 'pbpaste | tmux load-buffer - && tmux paste-buffer'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard'; \
   unbind -T copy-mode-vi Enter; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe 'xclip -in -selection clipboard'"

# --- Theme ---
source-file ~/.dotfiles/tmux/themes/powerline-base16.tmuxtheme

# --- Misc ---
bind r refresh-client

# Help popup (keybinding cheatsheet)
bind h display-popup -w 70% -h 70% -E "cat $HOME/.dotfiles/tmux/cheatsheet.txt | less -R"

# Popup shell (90% of screen)
bind J if-shell -F '#{==:#{session_name},popover}' 'detach-client' \
  'display-popup -w 90% -h 90% -E "tmux new-session -A -s popover"'

# Source local config if it exists
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
